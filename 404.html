<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Funnel has moved</title>

    <script>
        window.onload = function () {
            if (window.location.href.includes("ohsu-comp-bio.github.io/funnel")) {
                const redirectLocation = window.location.href.replace(
                    "ohsu-comp-bio.github.io/funnel",
                    "calypr.org/tools/funnel"
                );
                const msg = document.getElementById("msg");
                msg.textContent = "Funnel has moved to the CALYPR organization! Redirecting to ";
                const link = document.createElement("a");
                link.href = redirectLocation;
                link.textContent = redirectLocation;
                msg.appendChild(link);
                msg.appendChild(document.createTextNode(" ..."));
                window.location.href = redirectLocation;
            }
        }
    </script>
</head>

<body style="text-align: center">
    <p id="msg">Page not found</p>
</body>

</html>
